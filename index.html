<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design System Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Design System - Help Desk</h1>
<p>Biblioteca de Componentes UI</p>

<section>

    <h2>Botones</h2>

    <button class="btn btn-primary">
        Guardar
    </button>

    <button class="btn btn-secondary">
        Cancelar
    </button>

    <button class="btn btn-danger">
        Eliminar
    </button>

</section>

<section>

    <h2>Formularios</h2>

    <label for="nombre">
        Nombre del usuario
    </label>

    <input
        type="text"
        id="nombre"
        placeholder="Ingrese el nombre">

    <br><br>

    <label for="categoria">
        Categoría
    </label>

    <select id="categoria">

        <option>Hardware</option>

        <option>Software</option>

        <option>Redes</option>

    </select>

</section>

<section>

    <h2>Tarjeta del Ticket</h2>

    <div class="card">

        <h3>Incidente #001</h3>

        <p>
            Usuario:
            Ana Pérez
        </p>

        <p>
            Estado:
            Pendiente
        </p>

        <p>
            Descripción:
            La impresora no responde.
        </p>

    </div>

</section>

<section>

    <h2>Prioridades</h2>

    <span class="badge alta">
        Alta
    </span>

    <span class="badge media">
        Media
    </span>

    <span class="badge baja">
        Baja
    </span>

</section>
</body>

</html>
